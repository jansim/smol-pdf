name: Release

# Push a tag such as v1.1 to publish a release. The Homebrew cask
# (jansim/tools/smol-pdf) installs the latest release's smol-pdf.zip.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Toolchain
        run: swift --version && xcodebuild -version

      # Universal, so the cask and the downloads run on Intel Macs too.
      # The tag, without its "v", becomes the app's version.
      - name: Build
        run: VERSION="${GITHUB_REF_NAME#v}" ARCHS="arm64 x86_64" scripts/build-app.sh

      - name: Checks
        run: |
          lipo -archs build/smol-pdf.app/Contents/MacOS/SmolPDFApp
          lipo -archs build/bin/smolpdf
          codesign --verify --strict build/smol-pdf.app
          build/bin/smolpdf --help
          build/bin/smolpdf -v -p maximum -x all -o "$RUNNER_TEMP/maximum" test-document.pdf
          build/bin/smolpdf -v -p lossless -o "$RUNNER_TEMP/lossless" test-document.pdf

      # ditto, not zip, keeps the signature and extended attributes intact.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ditto -c -k --keepParent build/smol-pdf.app smol-pdf.zip
          mkdir "$RUNNER_TEMP/smolpdf-cli"
          cp build/smol-pdf.app/Contents/Resources/smolpdf "$RUNNER_TEMP/smolpdf-cli/"
          cp -R build/smol-pdf.app/Contents/Resources/Licenses "$RUNNER_TEMP/smolpdf-cli/"
          tar -czf smolpdf-cli.tar.gz -C "$RUNNER_TEMP" smolpdf-cli
          shasum -a 256 smol-pdf.zip smolpdf-cli.tar.gz | tee SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" smol-pdf.zip smolpdf-cli.tar.gz SHA256SUMS.txt --generate-notes
