name: Release

# Builds Apple silicon release binaries (or universal ones, when run by hand), attaches them to a
# release and points the Homebrew cask at them.
# GitHub sends no events for draft releases, so for a draft run this workflow by hand
# (Actions > Release > Run workflow) with the draft's tag; publishing it runs it again.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of the (draft) release to attach the binaries to
        required: true
      universal:
        description: Also build for Intel (universal binaries)
        type: boolean
        default: false

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60

    outputs:
      version: ${{ steps.ref.outputs.version }}
      platform: ${{ steps.package.outputs.platform }}
      sha256: ${{ steps.package.outputs.sha256 }}

    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      ARCHS: ${{ inputs.universal && 'arm64 x86_64' || 'arm64' }}
      PLATFORM: ${{ inputs.universal && 'macos-universal' || 'macos-arm64' }}

    steps:
      # A draft's tag doesn't exist until it is published: build the commit it targets instead.
      - name: Resolve commit
        id: ref
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --silent 2>/dev/null; then
            echo "ref=refs/tags/$TAG" >> "$GITHUB_OUTPUT"
          else
            echo "ref=$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json targetCommitish -q .targetCommitish)" >> "$GITHUB_OUTPUT"
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.ref }}
          submodules: true

      - name: Toolchain
        run: swift --version && xcodebuild -version

      - name: Build
        run: scripts/build-app.sh
        env:
          VERSION: ${{ steps.ref.outputs.version }}

      - name: Smoke test
        run: |
          lipo -archs build/smol-pdf.app/Contents/MacOS/SmolPDFApp
          lipo -archs build/bin/smolpdf
          codesign --verify --strict build/smol-pdf.app
          build/bin/smolpdf --help
          build/bin/smolpdf -v -p maximum -x all -o "$RUNNER_TEMP/maximum" test-document.pdf
          build/bin/smolpdf -v -p lossless -o "$RUNNER_TEMP/lossless" test-document.pdf

      - name: Package
        id: package
        run: |
          name="smol-pdf-${{ steps.ref.outputs.version }}-$PLATFORM"
          mkdir -p dist "$RUNNER_TEMP/$name-cli"
          ditto -c -k --sequesterRsrc --keepParent build/smol-pdf.app "dist/$name.zip"
          cp build/smol-pdf.app/Contents/Resources/smolpdf "$RUNNER_TEMP/$name-cli/"
          cp -R build/smol-pdf.app/Contents/Resources/Licenses "$RUNNER_TEMP/$name-cli/"
          tar -czf "dist/$name-cli.tar.gz" -C "$RUNNER_TEMP" "$name-cli"
          (cd dist && shasum -a 256 * > SHA256SUMS.txt && cat SHA256SUMS.txt)
          echo "platform=$PLATFORM" >> "$GITHUB_OUTPUT"
          echo "sha256=$(shasum -a 256 "dist/$name.zip" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Attach to release
        run: gh release upload "$TAG" dist/* --clobber -R "$GITHUB_REPOSITORY"

  # Points the Homebrew cask at the new app, on the default branch (the tap people install from),
  # once the release is the latest one: not for drafts, prereleases or rebuilds of older releases.
  cask:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      VERSION: ${{ needs.build.outputs.version }}
      PLATFORM: ${{ needs.build.outputs.platform }}
      SHA256: ${{ needs.build.outputs.sha256 }}

    steps:
      - name: Check that this is the latest release
        id: latest
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" -q .tag_name || true)
          echo "Latest release: ${latest:-none}"
          echo "update=$([ "$latest" = "$TAG" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.latest.outputs.update == 'true'
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Update the cask
        if: steps.latest.outputs.update == 'true'
        run: |
          # The cask's download URL is .../download/v<version>/smol-pdf-<version>-<platform>.zip.
          [ "$TAG" = "v$VERSION" ] || { echo "::error::Tag releases as v$VERSION for the cask, not $TAG"; exit 1; }
          sed -i -e "s/^  version \".*\"$/  version \"$VERSION\"/" -e "s/^  sha256 \".*\"$/  sha256 \"$SHA256\"/" \
            -e "s/-macos-[a-z0-9]*\.zip\"$/-$PLATFORM.zip\"/" -e "/^  depends_on arch: :arm64$/d" Casks/smol-pdf.rb
          # Apple silicon builds don't run on Intel Macs; universal ones do.
          if [ "$PLATFORM" = macos-arm64 ]; then
            sed -i "s/^  depends_on macos:/  depends_on arch: :arm64\n&/" Casks/smol-pdf.rb
          fi
          git diff
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update the Homebrew cask to $VERSION"
          git push
